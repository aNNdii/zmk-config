# ######################################################
## General
CONFIG_ZMK_KEYBOARD_NAME="Corne Pro"

### Power
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Make Bluetooth stronger
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Decrease profiles to 2 (+1 for split)
# CONFIG_BT_MAX_CONN=3
# CONFIG_BT_MAX_PAIRED=3

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=2
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=12

# Better key tracking for fast typing with home-row mods
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Less frequent battery reports save BLE bandwidth & a bit of power
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# Custom nice!view (gem) — uses board-provided nice_view_spi alias
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_GEM_ANIMATION=y
CONFIG_NICE_VIEW_GEM_ANIMATION_MS=8000

# RGB underglow disabled — color presets kept for when toggled on via &rgb_ug RGB_TOG
# Color rgb(203, 166, 247) ≈ hsv(267°, 33%, 5%) — minimal brightness
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=267
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=33
CONFIG_ZMK_RGB_UNDERGLOW_VAL_START=5
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=10
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# Windows battery reporting fix (recommended by Keebart)
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
